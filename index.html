  function pairKey(a,b){ return [a,b].sort().join("|"); }
  function pairVs(p1a,p1b,p2a,p2b){
    var k1=pairKey(p1a,p1b), k2=pairKey(p2a,p2b);
    var res={ games:0, w1:0, w2:0, pts1:0, pts2:0, list:[] };
    state.games.forEach(function(g){
      var t1=pairKey(g.t1[0],g.t1[1]), t2=pairKey(g.t2[0],g.t2[1]);
      var s1=+g.s1, s2=+g.s2, one, two;
      if(t1===k1 && t2===k2){ one=s1; two=s2; }

  function computeRatings(){
    var ratings={}, history={};
    function getR(id){ return ratings[id]!==undefined?ratings[id]:1000; }
    var ordered=state.games.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    var K=32;
    ordered.forEach(function(g){
      var r1=(getR(g.t1[0])+getR(g.t1[1]))/2, r2=(getR(g.t2[0])+getR(g.t2[1]))/2;
      var e1=1/(1+Math.pow(10,(r2-r1)/400)), e2=1-e1;
      var s1=+g.s1, s2=+g.s2;
      var a1=s1>s2?1:(s1<s2?0:0.5), a2=1-a1;
      // Margin-of-victory multiplier: a 1-point nail-biter counts for 0.6x K,
      // a 10+ point blowout counts for 1.5x K. Direction (win/loss) is unaffected
      // by this — it only scales how much a given win/loss moves the rating.
      var diff=Math.abs(s1-s2);

      g.t2.forEach(function(id){ ratings[id]=getR(id)+d2; (history[id]=history[id]||[]).push({date:g.date,delta:d2,after:ratings[id]}); });

  function bestDuo(gs){
    var m={};
    gs.forEach(function(g){ [g.t1,g.t2].forEach(function(t,ti){ var us=ti===0?+g.s1:+g.s2, them=ti===0?+g.s2:+g.s1;
      var k=pairKey(t[0],t[1]); if(!m[k])m[k]={ids:t.slice(),g:0,w:0}; m[k].g++; if(us>them)m[k].w++; }); });
    var arr=Object.keys(m).map(function(k){var r=m[k];r.pct=r.g?r.w/r.g:0;return r;}).filter(function(r){return r.g>=2;});
    arr.sort(function(x,y){ return (y.pct-x.pct)||(y.w-x.w)||(y.g-x.g); });
    return arr[0]||null;
  }
  function awardsBlock(gs){

    var mvp=byPts[0]; var sharp=byWin[0]; var duoR=bestDuo(gs);
    var cards=[];

    if(sharp) cards.push({i:"🎯",t:"Best Win %",n:(emojiOf(sharp.id)?emojiOf(sharp.id)+" ":"")+esc(sharp.name),d:pctStr(sharp)});

  function profileScreen(){
    var id=state._profileId;
    var p=state.players.find(function(x){return x.id===id;});
    var back='<button class="pill" data-act="tab" data-tab="board">&larr; Back</button>';
    if(!p) return back+emptyHTML("🤷","Player not found","This player may have been removed.",null);
    var all=statsFor(state.games);
    var me=all.find(function(r){return r.id===id;});
    var comp=computeRatings();
    var rating=comp.ratings[id]!==undefined?Math.round(comp.ratings[id]):1000;
    if(!me){
      return back+emptyHTML(emojiOf(id)||"🎾", p.name, "No games recorded yet for this player.",null);
    }
    var pct=Math.round((me.w/me.g)*100), avg=(Math.round((me.pf/me.g)*10)/10).toFixed(1);
    var partners=bestPartnerFor(id), opponents=toughestOpponentFor(id);
    var bestP=partners[0], worstP=partners.length>1?partners[partners.length-1]:null;
    var toughO=opponents[0];
    var wSeq=trailing(state.games,"W").find(function(s){return s.id===id;});
    var lSeq=trailing(state.games,"L").find(function(s){return s.id===id;});
    var curStreak=(wSeq&&wSeq.streak>0)?(wSeq.streak+"W"):(lSeq&&lSeq.streak>0?(lSeq.streak+"L"):"\u2014");

    var html=back+'<div class="champ" style="margin-top:12px"><div class="blob"></div>'+
      '<div class="tag">'+(emojiOf(id)?emojiOf(id)+" ":"🎾 ")+'Player Profile</div>'+
      '<div class="fe"><div class="name">'+esc(p.name)+'</div><div style="text-align:right"><div class="big tnum">'+rating+'</div><div class="unit">rating</div></div></div>'+
      '<div class="line tnum">'+me.g+' games &middot; '+me.w+'W '+me.l+'L &middot; '+pct+'% win rate</div></div>';
    html+='<div class="statgrid">'+statbox(avg,"avg pts")+statbox(me.pf,"total pts")+statbox(curStreak,"current streak")+statbox((me.diff>=0?"+":"")+me.diff,"point diff")+'</div>';
    var rel='';
    if(bestP) rel+=miniRow("🤝","Best partner",bestP.id,bestP.w+"W "+(bestP.g-bestP.w)+"L together");
    if(worstP) rel+=miniRow("😬","Toughest partnership",worstP.id,worstP.w+"W "+(worstP.g-worstP.w)+"L together");

  function skillScore(id){
    var m = statsFor(state.games).find(function(r){ return r.id===id; });
    if(!m || !m.g) return 0.5;
    // Shrink toward 0.5 for players with few games, using QUAL_MIN as the
    // "weight" of the prior — a brand new player starts at 0.5 and their
    // record only fully counts once they've played QUAL_MIN games or more.
    return (m.w + QUAL_MIN*0.5) / (m.g + QUAL_MIN);
  }

  function genTeams(balanced){
    var ap=activePlayers();
    var present=ap.filter(function(p){ return state._present && state._present[p.id]; });
    if(present.length<4) return;
    var arr=present.slice();
    if(balanced){
      arr.forEach(function(p){ p._skill=skillScore(p.id); });
      arr.sort(function(a,b){ return b._skill-a._skill; });
    } else {
      for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    }
    var courts=[]; var idx=0;
    while(arr.length-idx>=4){
      var chunk=arr.slice(idx,idx+4); idx+=4;
      var t1,t2;
      if(balanced){ t1=[chunk[0].id,chunk[3].id]; t2=[chunk[1].id,chunk[2].id]; }
      else { t1=[chunk[0].id,chunk[1].id]; t2=[chunk[2].id,chunk[3].id]; }
      courts.push([t1,t2]);
    }
    state._teams=courts;
    state._sitout=arr.slice(idx).map(function(p){ return p.id; });
    render();
  }

  function kotcRecord(){
    var k=state._kotc; if(!k) return;
    var sa=+k.scoreA||0, sb=+k.scoreB||0;
    if(sa===sb) return;
    state.games.push({id:uid(), t1:k.courtA.slice(), t2:k.courtB.slice(), s1:sa, s2:sb, date:todayISO()});
    var aWon=sa>sb;
    var winner=aWon?k.courtA.slice():k.courtB.slice();
    var loser=aWon?k.courtB.slice():k.courtA.slice();
    k.log.unshift({a:k.courtA.slice(), b:k.courtB.slice(), sa:sa, sb:sb, winnerIsA:aWon});
    k.queue=k.queue.concat(loser);
    if(k.queue.length>=2){
      k.courtB=k.queue.splice(0,2);
    } else {
      k.courtB=loser;
      k.queue=k.queue.filter(function(id){ return loser.indexOf(id)<0; });
    }
    k.courtA=winner;
    k.scoreA=0; k.scoreB=0;
    commit();
  }

  function wire(){

      if(act==="ptype"){ el.addEventListener("input",onNameType); return; }
      if(act==="snum"){ el.addEventListener("input",onScoreType); return; }
      if(act==="ksnum"){ el.addEventListener("input",function(e){ var f=e.target.getAttribute("data-field"); var v=parseInt(e.target.value,10); v=isNaN(v)?0:Math.max(0,v); if(state._kotc) state._kotc[f]=v; }); return; }

  function onClick(e){ var el=e.currentTarget, a=el.getAttribute("data-act");
    if(a==="tab"){ state.tab=el.getAttribute("data-tab"); state.confirmDelete=null; render(); }
    else if(a==="ttab"){ var t=el.getAttribute("data-t"); state.tab=(state.tab===t?"board":t); state.confirmDelete=null; render(); }
    else if(a==="mode"){ state.boardMode=el.getAttribute("data-mode"); render(); }
    else if(a==="hmode"){ state.hMode=el.getAttribute("data-m"); render(); }
    else if(a==="month"){ stepMonth(+el.getAttribute("data-dir")); }
    else if(a==="alltime"){ state.view.allTime=!state.view.allTime; state.view.day=null; render(); }
    else if(a==="clearday"){ state.view.day=null; render(); }
    else if(a==="opennew"){ openNew(); }
    else if(a==="closenew"){ state.showNew=false; state.draft=null; render(); }
    else if(a==="bg"){ if(e.target===e.currentTarget){ state.showNew=false; state.draft=null; render(); } }
    else if(a==="savegame"){ saveGame(); }
    else if(a==="step"){ var k=el.getAttribute("data-key"); state.draft[k]=Math.max(0,(+state.draft[k])+(+el.getAttribute("data-d"))); state.draft["_t"+k]=true; render(); }
    else if(a==="ppick"){ var slot=el.getAttribute("data-slot"); state.draft[slot]=el.getAttribute("data-id"); if(state.draft._typed) state.draft._typed[slot]=""; state.draft._active=null; render(); }
    else if(a==="paddnew"){ var sl=el.getAttribute("data-slot"); var nm=el.getAttribute("data-name").trim(); if(!nm) return;
      var ex=state.players.find(function(p){return p.active!==false&&p.name.toLowerCase()===nm.toLowerCase();});
      var pl; if(ex){ pl=ex; } else { pl={id:uid(),name:nm,active:true}; state.players.push(pl); }
      state.draft[sl]=pl.id; if(state.draft._typed) state.draft._typed[sl]=""; state.draft._active=null; commit(); }
    else if(a==="pclear"){ var s2=el.getAttribute("data-slot"); state.draft[s2]=""; if(state.draft._typed) state.draft._typed[s2]=""; render(); }
    else if(a==="emojipick"){ var pid=el.getAttribute("data-id"); state._emojiFor=(state._emojiFor===pid?null:pid); render(); }
    else if(a==="setemoji"){ var pid2=el.getAttribute("data-id"); var em=el.getAttribute("data-e"); var pl2=state.players.find(function(p){return p.id===pid2;}); if(pl2){ pl2.emoji=em||undefined; } state._emojiFor=null; commit(); }
    else if(a==="addplayer"){ addPlayer(); }
    else if(a==="removeplayer"){ setActive(el.getAttribute("data-id"),false); }
    else if(a==="restoreplayer"){ setActive(el.getAttribute("data-id"),true); }
    else if(a==="deleteplayer"){ state.players=state.players.filter(function(p){return p.id!==el.getAttribute("data-id");}); commit(); }
    else if(a==="togglerem"){ state.showRemoved=!state.showRemoved; render(); }
    else if(a==="askdel"){ state.confirmDelete=el.getAttribute("data-id"); render(); }
    else if(a==="cancel"){ state.confirmDelete=null; render(); }
    else if(a==="delgame"){ state.games=state.games.filter(function(g){return g.id!==el.getAttribute("data-id");}); state.confirmDelete=null; commit(); }
    else if(a==="sharereport"){ shareReport(); }
    else if(a==="openmatch"){ state.showMatch=true; render(); }
    else if(a==="closematch"){ state.showMatch=false; render(); }
    else if(a==="bgm"){ if(e.target===e.currentTarget){ state.showMatch=false; render(); } }
    else if(a==="mtoggle"){ if(!state._present) state._present={}; var mid=el.getAttribute("data-id"); state._present[mid]=!state._present[mid]; state._teams=null; render(); }
    else if(a==="genbalanced"){ genTeams(true); }
    else if(a==="genrandom"){ genTeams(false); }
    else if(a==="viewprofile"){ state._profileId=el.getAttribute("data-id"); state.tab="profile"; render(); }
    else if(a==="achperiod"){ state._achPeriod=el.getAttribute("data-p"); render(); }
    else if(a==="openkotc"){ state.showKotc=true; render(); }
    else if(a==="closekotc"){ state.showKotc=false; state._kotc=null; state._kotcPresent=null; render(); }
    else if(a==="endkotc"){ state.showKotc=false; state._kotc=null; state._kotcPresent=null; render(); }
    else if(a==="bgk"){ if(e.target===e.currentTarget){ state.showKotc=false; state._kotc=null; state._kotcPresent=null; render(); } }
    else if(a==="kotctoggle"){ if(!state._kotcPresent) state._kotcPresent={}; var kid=el.getAttribute("data-id"); state._kotcPresent[kid]=!state._kotcPresent[kid]; render(); }
    else if(a==="startkotc"){
      var kap=activePlayers();
      var kpresent=kap.filter(function(p){ return state._kotcPresent && state._kotcPresent[p.id]; });
      if(kpresent.length<4) return;
      var karr=kpresent.map(function(p){return p.id;});
      for(var ki=karr.length-1;ki>0;ki--){ var kj=Math.floor(Math.random()*(ki+1)); var kt=karr[ki]; karr[ki]=karr[kj]; karr[kj]=kt; }
      state._kotc={ courtA:karr.slice(0,2), courtB:karr.slice(2,4), queue:karr.slice(4), scoreA:0, scoreB:0, log:[] };
      render();
    }
    else if(a==="kstep"){ var kf=el.getAttribute("data-field"); if(state._kotc){ state._kotc[kf]=Math.max(0,(+state._kotc[kf])+(+el.getAttribute("data-d"))); render(); } }
    else if(a==="kotcfinish"){ kotcRecord(); }
  }

  function wrapText(ctx, text, maxW){
    var words=text.split(" "), lines=[], line="";
    for(var i=0;i<words.length;i++){ var test=line?line+" "+words[i]:words[i];
      if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; } else { line=test; } }
    if(line) lines.push(line); return lines;
  }
  function dataURLtoBlob(d){ var arr=d.split(","), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]), n=bstr.length, u8=new Uint8Array(n); while(n--){ u8[n]=bstr.charCodeAt(n); } return new Blob([u8],{type:mime}); }
  function roundRect(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r); x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
  function downloadImg(dataUrl,name){ var a=document.createElement("a"); a.href=dataUrl; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
  function shareReport(){
    try{
      var rep=generateReport(state._adate);
      var W=1080, pad=70, cardW=W-pad*2;
      var probe=document.createElement("canvas").getContext("2d"); probe.font="30px sans-serif";
      var blocks=[];
      rep.cards.forEach(function(c){ var lines=wrapText(probe, c.b, cardW-70); blocks.push({c:c, lines:lines, h: 34 + 44 + lines.length*40 + 30 }); });
      var headerH=430, footerH=90;
      var Ht=headerH; blocks.forEach(function(b){ Ht+=b.h+18; }); Ht+=footerH;
      var cv=document.createElement("canvas"); cv.width=W; cv.height=Ht; var x=cv.getContext("2d");
      x.fillStyle="#0f172a"; x.fillRect(0,0,W,Ht);
      x.fillStyle="#115e59"; x.fillRect(0,0,W,headerH-40);
      x.fillStyle="rgba(163,230,53,0.18)"; x.beginPath(); x.arc(W-90,90,150,0,7); x.fill();
      x.textBaseline="alphabetic";
      x.fillStyle="#bef264"; x.font="bold 26px sans-serif"; x.fillText("DAILY REPORT", pad, 100);
      x.fillStyle="#ffffff"; x.font="bold 62px sans-serif"; x.fillText("Early Morning", pad, 185); x.fillText("Pickle Showdown", pad, 255);
      x.fillStyle="#ccfbf1"; x.font="40px sans-serif"; x.fillText(fullDate(rep.date), pad, 320);
      x.fillStyle="#99f6e4"; x.font="28px sans-serif"; x.fillText(rep.headline, pad, 372);
      var y=headerH;
      blocks.forEach(function(b){
        x.fillStyle="#1e293b"; roundRect(x, pad, y, cardW, b.h, 20); x.fill();
        x.textBaseline="top"; x.fillStyle="#a3e635"; x.font="bold 30px sans-serif"; x.fillText(b.c.t.toUpperCase(), pad+34, y+30);
        x.fillStyle="#e2e8f0"; x.font="30px sans-serif";
        b.lines.forEach(function(ln,i){ x.fillText(ln, pad+34, y+30+48+i*40); });
        y+=b.h+18;
      });
      x.textBaseline="alphabetic"; x.fillStyle="#64748b"; x.font="24px sans-serif";
      x.fillText("Tracked live · Early Morning Pickle Showdown", pad, Ht-36);
      var dataUrl=cv.toDataURL("image/png");
      var blob=dataURLtoBlob(dataUrl);
      var file=new File([blob],"pickle-report-"+state._adate+".png",{type:"image/png"});
      var shareText="Early Morning Pickle Showdown — "+fullDate(state._adate);
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], text:shareText}).catch(function(){ downloadImg(dataUrl,file.name); });
      } else if(navigator.share){
        navigator.share({text:shareText}).catch(function(){ downloadImg(dataUrl,file.name); });
      } else { downloadImg(dataUrl,file.name); }
    }catch(err){ alert("Couldn't build the image: "+err.message); }
  }

  function stepMonth(dir){ if(state.view.day){ state.view.day=null; render(); return; } if(state.view.allTime){ state.view.allTime=false; render(); return; } var m=state.view.month+dir,y=state.view.year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.view.month=m; state.view.year=y; render(); }
  function openNew(){ if(activePlayers().length<4) return; state.draft={t1a:"",t1b:"",t2a:"",t2b:"",s1:0,s2:0,date:todayISO(),_typed:{},_active:null}; state.showNew=true; render(); }
  function saveGame(){ var d=state.draft; var picks=[d.t1a,d.t1b,d.t2a,d.t2b].filter(Boolean); if(picks.length!==4||new Set(picks).size!==4)return;
    state.games.push({id:uid(),t1:[d.t1a,d.t1b],t2:[d.t2a,d.t2b],s1:+d.s1||0,s2:+d.s2||0,date:d.date}); state.showNew=false; state.draft=null; state.tab="board"; commit(); }
  function addPlayer(){ var inp=document.getElementById("newPlayer"); if(!inp)return; var clean=inp.value.trim(); if(!clean)return;
    if(state.players.some(function(p){return p.active!==false&&p.name.toLowerCase()===clean.toLowerCase();})){ inp.value=""; return; }
    state.players.push({id:uid(),name:clean,active:true}); commit(); }
  function setActive(id,val){ var p=state.players.find(function(x){return x.id===id;}); if(p)p.active=val; commit(); }

  function boot(){ loadState().then(function(s){ state.players=s.players; state.games=s.games; state.sync="synced"; render(); })
    .catch(function(){ state.sync="offline"; render(); }); }
  setInterval(function(){ if(savingFlight||pendingSave||state.showNew) return;
    loadState().then(function(s){ var ch=JSON.stringify(s.players)!==JSON.stringify(state.players)||JSON.stringify(s.games)!==JSON.stringify(state.games);
      state.players=s.players; state.games=s.games; if(state.sync==="offline") state.sync="synced"; if(ch) render(); else updateSync();
    }).catch(function(){ state.sync="offline"; updateSync(); }); }, 5000);

  render(); boot();
})();
</script>
