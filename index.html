  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .tbox{ border-radius:16px; border:1px solid; padding:12px; } .tbox.teal{ border-color:#99f6e4; background:rgba(204,251,241,.4); } .tbox.lime{ border-color:#d9f99d; background:rgba(236,252,203,.4); }
  .tbox .lab{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--s500); margin-bottom:8px; }

  .gap{ height:8px; }
  .pinput{ width:100%; border-radius:8px; border:1px solid var(--s200); background:#fff; padding:8px 10px; font-size:14px; outline:none; font-family:inherit; }

  .sugg{ margin-top:5px; display:flex; flex-wrap:wrap; gap:5px; }
  .sugg button{ border:1px solid var(--s200); background:#fff; border-radius:999px; padding:5px 11px; font-size:13px; color:var(--s700); }

  .stepbox{ border-radius:16px; border:1px solid var(--s200); padding:12px; } .stepbox .lab{ text-align:center; font-size:12px; font-weight:500; color:var(--s500); margin-bottom:8px; }
  .stepper{ display:flex; align-items:center; justify-content:space-between; } .stepbtn{ width:36px; height:36px; border-radius:8px; background:var(--s100); color:var(--s700); font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; }

<div id="app" class="wrap"></div>
<script>
(function(){
  var SB_URL = "https://vtnymepdnvysurpufyqr.supabase.co";
  var SB_KEY = "sb_publishable_CZLYUJODQoAsPZXLacg1yA_IkCfmlvy";
  var ROW = SB_URL + "/rest/v1/scores_state?id=eq.main";
  var H = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };

  function loadState(){
    return fetch(ROW + "&select=data", { headers: H }).then(function(r){ if(!r.ok) throw new Error("load "+r.status); return r.json(); })
      .then(function(rows){ var d=(rows&&rows[0]&&rows[0].data)?rows[0].data:{}; return { players:Array.isArray(d.players)?d.players:[], games:Array.isArray(d.games)?d.games:[] }; });
  }
  function saveState(st){
    return fetch(ROW, { method:"PATCH", headers:Object.assign({},H,{Prefer:"return=minimal"}),
      body:JSON.stringify({ data:{players:st.players,games:st.games}, updated_at:new Date().toISOString() }) })
      .then(function(r){ if(!r.ok) throw new Error("save "+r.status); });
  }

  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var now=new Date();
  var state={ players:[], games:[], tab:"board", boardMode:"points",
    view:{year:now.getFullYear(),month:now.getMonth(),allTime:false,day:null},
    showNew:false, showRemoved:false, confirmDelete:null, draft:null, sync:"loading",
    hA:"", hB:"", hMode:"opponents", p1a:"", p1b:"", p2a:"", p2b:"" };
  var savingFlight=false, pendingSave=null;

  function uid(){ return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function fmtDate(iso){ var p=iso.split("-").map(Number); return MONTHS[p[1]-1].slice(0,3)+" "+p[2]+", "+p[0]; }
  function fullDate(iso){ var p=iso.split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]); return WEEKDAYS[d.getDay()]+", "+MONTHS[p[1]-1].slice(0,3)+" "+p[2]; }
  function nameOf(id){ var p=state.players.find(function(x){return x.id===id;}); return p?p.name:"Unknown"; }
  function activePlayers(){ return state.players.filter(function(p){return p.active!==false;}); }
  function removedPlayers(){ return state.players.filter(function(p){return p.active===false;}); }
  function monthGames(){
    if(state.view.day) return state.games.filter(function(g){ return g.date===state.view.day; });
    if(state.view.allTime) return state.games;
    return state.games.filter(function(g){ var p=g.date.split("-").map(Number); return p[0]===state.view.year && (p[1]-1)===state.view.month; });
  }

  function commit(){ render(); pushSave({players:state.players,games:state.games}); }
  function pushSave(snap){ if(savingFlight){ pendingSave=snap; return; } savingFlight=true; setSync("saving");
    saveState(snap).then(function(){setSync("synced");}).catch(function(){setSync("offline");})
      .then(function(){ savingFlight=false; if(pendingSave){ var p=pendingSave; pendingSave=null; pushSave(p); } }); }
  function setSync(s){ state.sync=s; if(document.getElementById("syncDot")) updateSync(); }

  function statsFor(gs){ var m={}; function e(id){ if(!m[id]) m[id]={id:id,pf:0,pa:0,g:0,w:0,l:0}; return m[id]; }
    gs.forEach(function(g){ var a=+g.s1,b=+g.s2;
      g.t1.forEach(function(id){var r=e(id);r.pf+=a;r.pa+=b;r.g++;if(a>b)r.w++;else if(a<b)r.l++;});
      g.t2.forEach(function(id){var r=e(id);r.pf+=b;r.pa+=a;r.g++;if(b>a)r.w++;else if(b<a)r.l++;}); });
    return Object.keys(m).map(function(k){var r=m[k];r.name=nameOf(r.id);r.diff=r.pf-r.pa;return r;}); }
  function ranked(gs, mode){
    var arr=statsFor(gs);
    arr.forEach(function(r){ r.pct = r.g ? r.w/r.g : 0; r.avg = r.g ? r.pf/r.g : 0; });
    if(mode==="winpct"){ arr.sort(function(x,y){ return (y.pct-x.pct)||(y.w-x.w)||(y.diff-x.diff)||x.name.localeCompare(y.name); }); }
    else if(mode==="avg"){ arr.sort(function(x,y){ return (y.avg-x.avg)||(y.pf-x.pf)||(y.diff-x.diff)||x.name.localeCompare(y.name); }); }
    else { arr.sort(function(x,y){ return mode==="wins"
      ? (y.w-x.w)||(y.diff-x.diff)||(y.pf-x.pf)||x.name.localeCompare(y.name)
      : (y.pf-x.pf)||(y.diff-x.diff)||(y.w-x.w)||x.name.localeCompare(y.name); }); }
    return arr;
  }
  var QUAL_MIN=4;
  function pctStr(r){ return Math.round(r.pct*100)+"%"; }
  function avgStr(r){ return (Math.round(r.avg*10)/10).toFixed(1); }
  function trailing(gs,target){ var ord=gs.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); var seq={};
    ord.forEach(function(g){ var a=+g.s1,b=+g.s2,aw=a>b,bw=b>a;
      g.t1.forEach(function(id){(seq[id]=seq[id]||[]).push(aw?"W":bw?"L":"T");});
      g.t2.forEach(function(id){(seq[id]=seq[id]||[]).push(bw?"W":aw?"L":"T");}); });
    return Object.keys(seq).map(function(id){var arr=seq[id],s=0;for(var i=arr.length-1;i>=0;i--){if(arr[i]===target)s++;else break;}return {id:id,name:nameOf(id),streak:s};}); }
  function moodEmoji(rank,total){ if(total<2)return "🎾"; if(rank===1)return "😎"; if(rank===total)return "😠"; if(rank===2)return "😄"; if(rank===3)return "🙂"; if(rank>total-2)return "😕"; return "😐"; }

  function h2h(idA, idB){
    var res={ games:0, aWins:0, bWins:0, aPts:0, bPts:0, list:[] };
    state.games.forEach(function(g){
      var aOn1=g.t1.indexOf(idA)>-1, aOn2=g.t2.indexOf(idA)>-1;
      var bOn1=g.t1.indexOf(idB)>-1, bOn2=g.t2.indexOf(idB)>-1;
      var opposed=(aOn1&&bOn2)||(aOn2&&bOn1); if(!opposed) return;
      var s1=+g.s1, s2=+g.s2; var aScore=aOn1?s1:s2, bScore=bOn1?s1:s2;
      res.games++; res.aPts+=aScore; res.bPts+=bScore;
      if(aScore>bScore) res.aWins++; else if(bScore>aScore) res.bWins++;
      res.list.push({date:g.date, aScore:aScore, bScore:bScore});
    });
    res.list.sort(function(x,y){ return x.date<y.date?1:x.date>y.date?-1:0; });
    return res;
  }
  function pairKey(a,b){ return [a,b].sort().join("|"); }
  function pairVs(p1a,p1b,p2a,p2b){
    // games where {p1a,p1b} faced {p2a,p2b} (order-independent)
    var k1=pairKey(p1a,p1b), k2=pairKey(p2a,p2b);
    var res={ games:0, w1:0, w2:0, pts1:0, pts2:0, list:[] };
    state.games.forEach(function(g){
      var t1=pairKey(g.t1[0],g.t1[1]), t2=pairKey(g.t2[0],g.t2[1]);
      var s1=+g.s1, s2=+g.s2, one, two;
      if(t1===k1 && t2===k2){ one=s1; two=s2; }
      else if(t1===k2 && t2===k1){ one=s2; two=s1; }
      else return;
      res.games++; res.pts1+=one; res.pts2+=two;
      if(one>two) res.w1++; else if(two>one) res.w2++;
      res.list.push({date:g.date, s1:one, s2:two});
    });
    res.list.sort(function(x,y){ return x.date<y.date?1:x.date>y.date?-1:0; });
    return res;
  }
  function duo(idA, idB){
    var res={ games:0, wins:0, losses:0, pf:0, pa:0, list:[] };
    state.games.forEach(function(g){
      var both1=g.t1.indexOf(idA)>-1 && g.t1.indexOf(idB)>-1;
      var both2=g.t2.indexOf(idA)>-1 && g.t2.indexOf(idB)>-1;
      if(!both1 && !both2) return;
      var s1=+g.s1, s2=+g.s2; var us=both1?s1:s2, them=both1?s2:s1;
      res.games++; res.pf+=us; res.pa+=them;
      if(us>them) res.wins++; else if(them>us) res.losses++;
      var oppIds=both1?g.t2:g.t1;
      res.list.push({date:g.date, us:us, them:them, opp:oppIds.map(nameOf).join(" & ")});
    });
    res.list.sort(function(x,y){ return x.date<y.date?1:x.date>y.date?-1:0; });
    return res;
  }

  function generateReport(date){
    var dG=state.games.filter(function(g){return g.date===date;});
    var court=ranked(dG,"wins"); var totalPts=dG.reduce(function(s,g){return s+(+g.s1)+(+g.s2);},0);
    var cards=[]; var headline=dG.length+" game"+(dG.length===1?"":"s")+" · "+court.length+" player"+(court.length===1?"":"s")+" · "+totalPts+" points";
    if(court.length){ var m=court[0]; var wr=m.g?Math.round((m.w/m.g)*100):0;
      cards.push({i:"⭐",t:"Player of the Day",b:m.name+" led with "+m.w+"W "+m.l+"L across "+m.g+" game"+(m.g===1?"":"s")+", "+m.pf+" points ("+wr+"% win rate)."}); }
    if(dG.length){ var big=dG[0]; dG.forEach(function(g){ if(Math.abs((+g.s1)-(+g.s2))>Math.abs((+big.s1)-(+big.s2)))big=g; });
      var a=+big.s1,b=+big.s2,wT=a>=b?big.t1:big.t2,lT=a>=b?big.t2:big.t1,bm=Math.abs(a-b);
      cards.push({i:"💥",t:"Statement Win",b: bm===0?"Every game stayed tight.":(wT.map(nameOf).join(" & ")+" beat "+lT.map(nameOf).join(" & ")+" "+Math.max(a,b)+"–"+Math.min(a,b)+".")}); }
    var hot=trailing(state.games,"W").filter(function(s){return s.streak>=2;}).sort(function(a,b){return b.streak-a.streak;});
    if(hot.length) cards.push({i:"📈",t:"On Fire",b:hot[0].name+" is on a "+hot[0].streak+"-game win streak."});
    var cold=trailing(state.games,"L").filter(function(s){return s.streak>=2;}).sort(function(a,b){return b.streak-a.streak;});
    if(cold.length) cards.push({i:"📉",t:"Cold Spell",b:cold[0].name+" has dropped "+cold[0].streak+" in a row."});
    cards.push({i:"🎤",t:"Analyst's Take",b:["Tighten the serve returns.","Momentum is everything.","The margins are razor-thin at the top.","Early mornings reward the bold."][(dG.length+totalPts)%4]});
    return {date:date,headline:headline,cards:cards};
  }

    var pct=Math.round((r.wins/r.games)*100), diff=r.pf-r.pa;
    var html='<div class="champ" style="margin-top:12px"><div class="blob"></div><div class="tag">🤝 As partners · '+r.games+' game'+(r.games===1?'':'s')+'</div>'+
      '<div class="fe"><div class="name" style="font-size:20px">'+esc(A)+' &amp; '+esc(B)+'</div>'+
      '<div style="text-align:right"><div class="big tnum">'+pct+'%</div><div class="unit">win rate</div></div></div>'+
      '<div class="line tnum">'+r.wins+'W '+r.losses+'L · '+r.pf+' pts for · '+(diff>=0?"+":"")+diff+' diff</div></div>';
    html+='<div class="h2htable">'+
      '<div class="h2hr"><div class="hv lead tnum">'+r.wins+'</div><div class="hl">Wins together</div><div class="hv tnum">'+r.losses+'</div></div>'+
      '<div class="h2hr"><div class="hv lead tnum">'+pct+'%</div><div class="hl">Win rate</div><div class="hv tnum">'+r.games+'</div></div></div>'+
      '<div class="note" style="text-align:left;margin-top:6px">Left: wins / win rate · Right: losses / games played</div>';
    html+='<div class="note" style="margin-top:16px;text-align:left">Games together</div><div class="rows" style="margin-top:8px">';
    r.list.slice(0,10).forEach(function(m){ var won=m.us>m.them, lost=m.them>m.us;
      html+='<div class="game"><div class="gbody">'+
        '<div class="team '+(won?'win':'')+'"><div class="p">'+esc(A)+' &amp; '+esc(B)+'</div></div>'+
        '<div class="score"><span class="sc '+(won?'win':'')+' tnum">'+m.us+'</span><span class="dash">&ndash;</span><span class="sc '+(lost?'win':'')+' tnum">'+m.them+'</span></div>'+
        '<div class="team right '+(lost?'win':'')+'"><div class="p">'+esc(m.opp)+'</div></div></div>'+
        '<div class="gdate" style="margin-top:6px;text-align:center">'+fmtDate(m.date)+'</div></div>';
    });
    return html+'</div>';
  }
  function h2hRow(label, av, bv, aLead, bLead){
    return '<div class="h2hr"><div class="hv '+(aLead?'lead':'')+' tnum">'+av+'</div><div class="hl">'+label+'</div><div class="hv '+(bLead?'lead':'')+' tnum">'+bv+'</div></div>';
  }

  function playersScreen(ap){
    var html='<div class="addrow"><input id="newPlayer" placeholder="Add a player&hellip;" /><button data-act="addplayer">Add</button></div>';
    if(ap.length===0){ html+=emptyHTML("👥","No players yet","Add everyone who shows up to play. You need at least 4 to record a doubles game.",null); }
    else { html+='<div class="rows" style="margin-top:16px">';
      ap.forEach(function(p){ var has=state.games.some(function(g){return g.t1.indexOf(p.id)>-1||g.t2.indexOf(p.id)>-1;});
        var act=has?'<button class="ghost" data-act="removeplayer" data-id="'+p.id+'">Remove</button>':'<button class="iconbtn" data-act="deleteplayer" data-id="'+p.id+'">&#128465;</button>';
        html+='<div class="player"><div class="avatar">'+esc(p.name.charAt(0).toUpperCase())+'</div><div class="pn">'+esc(p.name)+'</div>'+act+'</div>'; });
      html+='</div>';
    }
    var rem=removedPlayers();
    if(rem.length>0){ html+='<div style="margin-top:20px"><button class="ghost" data-act="togglerem">'+(state.showRemoved?"Hide":"Show")+' removed players ('+rem.length+')</button>';
      if(state.showRemoved){ html+='<div class="rows" style="margin-top:8px">'+rem.map(function(p){return '<div class="removed"><div class="pn">'+esc(p.name)+'</div><button class="restore" data-act="restoreplayer" data-id="'+p.id+'">&#8634; Restore</button></div>';}).join("")+'</div>'; }
      html+='</div>'; }
    return html+'<div class="note" style="text-align:left;margin-top:20px">Removed players stay on past leaderboards but won\'t appear when recording new games.</div>';
  }
  function emptyHTML(ic,t,b,cta){ return '<div class="empty"><div class="ec">'+ic+'</div><h3>'+esc(t)+'</h3><p>'+esc(b)+'</p>'+(cta?'<button class="cta" data-act="opennew">'+esc(cta)+'</button>':'')+'</div>'; }
  function nav(ap){ var can=ap.length>=4;
    return '<nav><button class="navbtn '+(state.tab==="board"?'on':'')+'" data-act="tab" data-tab="board"><span class="ni">🏆</span>Leaderboard</button>'+
      '<button class="fab" data-act="opennew" '+(can?'':'disabled')+'>+</button>'+
      '<button class="navbtn '+(state.tab==="players"?'on':'')+'" data-act="tab" data-tab="players"><span class="ni">👥</span>Players</button></nav>';
  }
  function histPills(){
    return '<div class="histwrap"><button class="pill '+(state.tab==="games"?'on':'')+'" data-act="ttab" data-t="games">☰ Games</button>'+
      '<button class="pill '+(state.tab==="h2h"?'on':'')+'" data-act="ttab" data-t="h2h">🆚 H2H</button>'+
      '<button class="pill '+(state.tab==="report"?'on':'')+'" data-act="ttab" data-t="report">📋 Analyst</button></div>';
  }

  function sheet(ap){
    var d=state.draft; var picks=[d.t1a,d.t1b,d.t2a,d.t2b]; var chosen=picks.filter(Boolean);
    var distinct=new Set(chosen).size===chosen.length; var complete=chosen.length===4&&distinct;
    function slot(k){
      var id=d[k]; var typed=(d._typed&&d._typed[k])||"";
      if(id){ return '<div class="pslot"><input class="pinput chosen" data-act="pclear" data-slot="'+k+'" value="'+esc(nameOf(id))+'" readonly /></div>'; }
      var q=typed.trim().toLowerCase();
      var avail=ap.filter(function(p){ return picks.indexOf(p.id)<0; });
      var showSug = state.draft._active===k && q.length>0;
      var sug="";
      if(showSug){
        var matches=avail.filter(function(p){ return p.name.toLowerCase().indexOf(q)>-1; }).slice(0,6);
        var exact=avail.some(function(p){ return p.name.toLowerCase()===q; });
        sug=matches.map(function(p){ return '<button data-act="ppick" data-slot="'+k+'" data-id="'+p.id+'">'+esc(p.name)+'</button>'; }).join("");
        if(!exact) sug+='<button data-act="paddnew" data-slot="'+k+'" data-name="'+esc(typed.trim())+'" style="border-color:var(--teal);color:var(--teal)">+ Add \u201c'+esc(typed.trim())+'\u201d</button>';
      }
      return '<div class="pslot"><input class="pinput" data-act="ptype" data-slot="'+k+'" value="'+esc(typed)+'" placeholder="Type or 🎤 name" autocomplete="off" />'+
        (sug?'<div class="sugg">'+sug+'</div>':'')+'</div>';
    }
    function tbox(label,tint,ka,kb){ return '<div class="tbox '+tint+'"><div class="lab"><span class="dot"></span>'+label+'</div>'+slot(ka)+'<div class="gap"></div>'+slot(kb)+'</div>'; }
    function sbox(label,key,val){ return '<div class="stepbox"><div class="lab">'+label+'</div><div class="stepper"><button class="stepbtn" data-act="step" data-key="'+key+'" data-d="-1">&minus;</button><input class="snum tnum" type="number" inputmode="numeric" min="0" data-act="snum" data-key="'+key+'" value="'+val+'" /><button class="stepbtn" data-act="step" data-key="'+key+'" data-d="1">+</button></div></div>'; }
    return '<div class="overlay" data-act="bg"><div class="sheet"><div class="grab"></div>'+
      '<div class="shead"><h2>🎾 Record game</h2><button class="closeb" data-act="closenew">&times;</button></div>'+
      '<div class="note" style="text-align:left;margin-top:4px">Tip: tap a name box, then the 🎤 on your keyboard to speak the name.</div>'+
      '<div class="two">'+tbox("Team A","teal","t1a","t1b")+tbox("Team B","lime","t2a","t2b")+'</div>'+
      '<div class="two">'+sbox("Team A score","s1",d.s1)+sbox("Team B score","s2",d.s2)+'</div>'+
      '<div class="datebox"><span class="dl">📅 Date</span><input type="date" value="'+d.date+'" data-act="setdate" /></div>'+
      ((!distinct&&chosen.length>0)?'<div class="warn">Each player can only be picked once.</div>':'')+
      '<button class="save" data-act="savegame" '+(complete?'':'disabled')+'>Save game</button></div></div>';
  }

  function wire(){
    document.querySelectorAll("[data-act]").forEach(function(el){
      var act=el.getAttribute("data-act");
      if(act==="hpick"){ el.addEventListener("change",function(e){ state[e.target.getAttribute("data-slot")]=e.target.value; render(); }); return; }
      if(act==="ptype"){ el.addEventListener("input",onNameType); return; }
      if(act==="snum"){ el.addEventListener("input",onScoreType); return; }
      if(act==="setdate"){ el.addEventListener("change",function(e){ state.draft.date=e.target.value; }); return; }
      if(act==="setday"){ el.addEventListener("change",function(e){ state.view.day=e.target.value||null; if(state.view.day) state.view.allTime=false; render(); }); return; }
      if(act==="adate"){ el.addEventListener("change",function(e){ state._adate=e.target.value; render(); }); return; }
      el.addEventListener("click",onClick);
    });
    var np=document.getElementById("newPlayer"); if(np){ np.addEventListener("keydown",function(e){ if(e.key==="Enter") addPlayer(); }); }
  }
  function onScoreType(e){
    var k=e.target.getAttribute("data-key"); var v=parseInt(e.target.value,10); v=isNaN(v)?0:Math.max(0,v);
    state.draft[k]=v; state.draft["_t"+k]=true;
    var other=k==="s1"?"s2":"s1";
    if(v<15 && !state.draft["_t"+other]){ state.draft[other]=15; var oel=document.querySelector('[data-act="snum"][data-key="'+other+'"]'); if(oel && document.activeElement!==oel) oel.value=15; }
  }
  function onNameType(e){
    var el=e.target, k=el.getAttribute("data-slot"), val=el.value;
    if(!state.draft._typed) state.draft._typed={}; state.draft._typed[k]=val; state.draft._active=k;
    var picks=[state.draft.t1a,state.draft.t1b,state.draft.t2a,state.draft.t2b];
    var q=val.trim().toLowerCase();
    var ap=activePlayers();
    var wrap=el.parentNode; var sug=wrap.querySelector(".sugg");
    if(!sug){ sug=document.createElement("div"); sug.className="sugg"; wrap.appendChild(sug); }
    if(!q){ sug.innerHTML=""; return; }
    var matches=ap.filter(function(p){ return picks.indexOf(p.id)<0 && p.name.toLowerCase().indexOf(q)>-1; }).slice(0,6);
    var exact=ap.some(function(p){ return p.name.toLowerCase()===q; });
    var htmlS=matches.map(function(p){ return '<button data-act="ppick" data-slot="'+k+'" data-id="'+p.id+'">'+esc(p.name)+'</button>'; }).join("");
    if(!exact) htmlS+='<button data-act="paddnew" data-slot="'+k+'" data-name="'+esc(val.trim())+'" style="border-color:var(--teal);color:var(--teal)">+ Add \u201c'+esc(val.trim())+'\u201d</button>';
    sug.innerHTML = htmlS;
    sug.querySelectorAll("button").forEach(function(b){ b.addEventListener("click",onClick); });
  }
  function onClick(e){ var el=e.currentTarget, a=el.getAttribute("data-act");
    if(a==="tab"){ state.tab=el.getAttribute("data-tab"); state.confirmDelete=null; render(); }
    else if(a==="ttab"){ var t=el.getAttribute("data-t"); state.tab=(state.tab===t?"board":t); state.confirmDelete=null; render(); }
    else if(a==="mode"){ state.boardMode=el.getAttribute("data-mode"); render(); }
    else if(a==="hmode"){ state.hMode=el.getAttribute("data-m"); render(); }
    else if(a==="month"){ stepMonth(+el.getAttribute("data-dir")); }
    else if(a==="alltime"){ state.view.allTime=!state.view.allTime; state.view.day=null; render(); }
    else if(a==="clearday"){ state.view.day=null; render(); }
    else if(a==="opennew"){ openNew(); }
    else if(a==="closenew"){ state.showNew=false; state.draft=null; render(); }
    else if(a==="bg"){ if(e.target===e.currentTarget){ state.showNew=false; state.draft=null; render(); } }
    else if(a==="savegame"){ saveGame(); }
    else if(a==="step"){ var k=el.getAttribute("data-key"); state.draft[k]=Math.max(0,(+state.draft[k])+(+el.getAttribute("data-d"))); state.draft["_t"+k]=true; render(); }
    else if(a==="ppick"){ var slot=el.getAttribute("data-slot"); state.draft[slot]=el.getAttribute("data-id"); if(state.draft._typed) state.draft._typed[slot]=""; state.draft._active=null; render(); }
    else if(a==="paddnew"){ var sl=el.getAttribute("data-slot"); var nm=el.getAttribute("data-name").trim(); if(!nm) return;
      var ex=state.players.find(function(p){return p.active!==false&&p.name.toLowerCase()===nm.toLowerCase();});
      var pl; if(ex){ pl=ex; } else { pl={id:uid(),name:nm,active:true}; state.players.push(pl); }
      state.draft[sl]=pl.id; if(state.draft._typed) state.draft._typed[sl]=""; state.draft._active=null; commit(); }
    else if(a==="pclear"){ var s2=el.getAttribute("data-slot"); state.draft[s2]=""; if(state.draft._typed) state.draft._typed[s2]=""; render(); }
    else if(a==="addplayer"){ addPlayer(); }
    else if(a==="removeplayer"){ setActive(el.getAttribute("data-id"),false); }
    else if(a==="restoreplayer"){ setActive(el.getAttribute("data-id"),true); }
    else if(a==="deleteplayer"){ state.players=state.players.filter(function(p){return p.id!==el.getAttribute("data-id");}); commit(); }
    else if(a==="togglerem"){ state.showRemoved=!state.showRemoved; render(); }
    else if(a==="askdel"){ state.confirmDelete=el.getAttribute("data-id"); render(); }
    else if(a==="cancel"){ state.confirmDelete=null; render(); }
    else if(a==="delgame"){ state.games=state.games.filter(function(g){return g.id!==el.getAttribute("data-id");}); state.confirmDelete=null; commit(); }
    else if(a==="sharereport"){ shareReport(); }
  }

  function wrapText(ctx, text, maxW){
    var words=text.split(" "), lines=[], line="";
    for(var i=0;i<words.length;i++){ var test=line?line+" "+words[i]:words[i];
      if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; } else { line=test; } }
    if(line) lines.push(line); return lines;
  }
  function dataURLtoBlob(d){ var arr=d.split(","), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]), n=bstr.length, u8=new Uint8Array(n); while(n--){ u8[n]=bstr.charCodeAt(n); } return new Blob([u8],{type:mime}); }
  function roundRect(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r); x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
  function downloadImg(dataUrl,name){ var a=document.createElement("a"); a.href=dataUrl; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
  function shareReport(){
    try{
      var rep=generateReport(state._adate);
      var W=1080, pad=70, cardW=W-pad*2;
      var probe=document.createElement("canvas").getContext("2d"); probe.font="30px sans-serif";
      var blocks=[];
      rep.cards.forEach(function(c){ var lines=wrapText(probe, c.b, cardW-70); blocks.push({c:c, lines:lines, h: 34 + 44 + lines.length*40 + 30 }); });
      var headerH=430, footerH=90;
      var Ht=headerH; blocks.forEach(function(b){ Ht+=b.h+18; }); Ht+=footerH;
      var cv=document.createElement("canvas"); cv.width=W; cv.height=Ht; var x=cv.getContext("2d");
      x.fillStyle="#0f172a"; x.fillRect(0,0,W,Ht);
      x.fillStyle="#115e59"; x.fillRect(0,0,W,headerH-40);
      x.fillStyle="rgba(163,230,53,0.18)"; x.beginPath(); x.arc(W-90,90,150,0,7); x.fill();
      x.textBaseline="alphabetic";
      x.fillStyle="#bef264"; x.font="bold 26px sans-serif"; x.fillText("DAILY REPORT", pad, 100);
      x.fillStyle="#ffffff"; x.font="bold 62px sans-serif"; x.fillText("Early Morning", pad, 185); x.fillText("Pickle Showdown", pad, 255);
      x.fillStyle="#ccfbf1"; x.font="40px sans-serif"; x.fillText(fullDate(rep.date), pad, 320);
      x.fillStyle="#99f6e4"; x.font="28px sans-serif"; x.fillText(rep.headline, pad, 372);
      var y=headerH;
      blocks.forEach(function(b){
        x.fillStyle="#1e293b"; roundRect(x, pad, y, cardW, b.h, 20); x.fill();
        x.textBaseline="top"; x.fillStyle="#a3e635"; x.font="bold 30px sans-serif"; x.fillText(b.c.t.toUpperCase(), pad+34, y+30);
        x.fillStyle="#e2e8f0"; x.font="30px sans-serif";
        b.lines.forEach(function(ln,i){ x.fillText(ln, pad+34, y+30+48+i*40); });
        y+=b.h+18;
      });
      x.textBaseline="alphabetic"; x.fillStyle="#64748b"; x.font="24px sans-serif";
      x.fillText("Tracked live · Early Morning Pickle Showdown", pad, Ht-36);
      var dataUrl=cv.toDataURL("image/png");
      var blob=dataURLtoBlob(dataUrl);
      var file=new File([blob],"pickle-report-"+state._adate+".png",{type:"image/png"});
      var shareText="Early Morning Pickle Showdown — "+fullDate(state._adate);
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], text:shareText}).catch(function(){ downloadImg(dataUrl,file.name); });
      } else if(navigator.share){
        navigator.share({text:shareText}).catch(function(){ downloadImg(dataUrl,file.name); });
      } else { downloadImg(dataUrl,file.name); }
    }catch(err){ alert("Couldn't build the image: "+err.message); }
  }

  function stepMonth(dir){ if(state.view.day){ state.view.day=null; render(); return; } if(state.view.allTime){ state.view.allTime=false; render(); return; } var m=state.view.month+dir,y=state.view.year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.view.month=m; state.view.year=y; render(); }
  function openNew(){ if(activePlayers().length<4) return; state.draft={t1a:"",t1b:"",t2a:"",t2b:"",s1:0,s2:0,date:todayISO(),_typed:{},_active:null}; state.showNew=true; render(); }
  function saveGame(){ var d=state.draft; var picks=[d.t1a,d.t1b,d.t2a,d.t2b].filter(Boolean); if(picks.length!==4||new Set(picks).size!==4)return;
    state.games.push({id:uid(),t1:[d.t1a,d.t1b],t2:[d.t2a,d.t2b],s1:+d.s1||0,s2:+d.s2||0,date:d.date}); state.showNew=false; state.draft=null; state.tab="board"; commit(); }
  function addPlayer(){ var inp=document.getElementById("newPlayer"); if(!inp)return; var clean=inp.value.trim(); if(!clean)return;
    if(state.players.some(function(p){return p.active!==false&&p.name.toLowerCase()===clean.toLowerCase();})){ inp.value=""; return; }
    state.players.push({id:uid(),name:clean,active:true}); commit(); }
  function setActive(id,val){ var p=state.players.find(function(x){return x.id===id;}); if(p)p.active=val; commit(); }

  function boot(){ loadState().then(function(s){ state.players=s.players; state.games=s.games; state.sync="synced"; render(); })
    .catch(function(){ state.sync="offline"; render(); }); }
  setInterval(function(){ if(savingFlight||pendingSave||state.showNew) return;
    loadState().then(function(s){ var ch=JSON.stringify(s.players)!==JSON.stringify(state.players)||JSON.stringify(s.games)!==JSON.stringify(state.games);
      state.players=s.players; state.games=s.games; if(state.sync==="offline") state.sync="synced"; if(ch) render(); else updateSync();
    }).catch(function(){ state.sync="offline"; updateSync(); }); }, 5000);

  render(); boot();
})();
</script>
</body>
</html>
